[package]
name = "sideload-readiness"
version = "0.1.5"
edition = "2021"
description = "Read-only Android sideload readiness checks"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-sideload-readiness"
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[[bin]]
name = "sideload-readiness"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.27", features = ["derive"] }
apk-info-zip = "1.0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.16"
