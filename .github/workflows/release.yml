name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out/root/usr/local/bin
          cp target/${{ matrix.target }}/release/sideload-readiness out/root/usr/local/bin/
          cp target/${{ matrix.target }}/release/sideload-readiness out/sideload-readiness
          chmod +x out/sideload-readiness
          tar -C out -czf out/sideload-readiness-${{ matrix.label }}.tar.gz sideload-readiness
      - name: Package macOS pkg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          pkgbuild --root out/root --identifier in.sociobot.sideload-readiness --version "$version" out/sideload-readiness-${{ matrix.label }}.pkg
      - name: Package Linux deb and rpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p out/deb/DEBIAN
          printf 'Package: sideload-readiness\nVersion: %s\nArchitecture: amd64\nMaintainer: Param Factory\nDescription: Read-only Android sideload readiness checks\n' "$version" > out/deb/DEBIAN/control
          mkdir -p out/deb/usr/local/bin
          cp out/sideload-readiness out/deb/usr/local/bin/
          dpkg-deb --build out/deb out/sideload-readiness-linux-x86_64.deb
          sudo apt-get update && sudo apt-get install -y rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1
          "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager rpm --target out/sideload-readiness-linux-x86_64.rpm
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/sideload-readiness.exe out/sideload-readiness.exe
          Compress-Archive -Path out/sideload-readiness.exe -DestinationPath out/sideload-readiness-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            out/*.tar.gz
            out/*.pkg
            out/*.deb
            out/*.rpm
            out/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $version." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build release manifest and checksums
        shell: bash
        run: |
          mkdir assets
          find release -type f -exec cp {} assets/ \;
          cd assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name latest.json -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cd ..
          node scripts/create-release-manifest.mjs assets "${{ steps.release.outputs.tag }}" "$GITHUB_REPOSITORY"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: assets/*
          generate_release_notes: true
